<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VES-PD // GEO-INTEL MAP</title>

  <!-- Fonts: Orbitron (tech) + Prompt (Thai) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <!-- Map Module Styles -->
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/map-module/src/map-style.css?v=40" />
  <link rel="stylesheet" href="/map-module/overlay/src/overlay-style.css?v=32" />
  <!-- Leaflet.draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
</head>
<body>
  <!-- ═══════════ BOOT SCREEN ═══════════ -->
  <div class="mhnk-boot" id="mhnk-boot">
    <div class="mhnk-boot-grid"></div>
    <div class="mhnk-boot-inner">
      <div class="mhnk-boot-badge"><img class="mhnk-boot-logo" src="/logo.gif" alt="VES-PD"></div>
      <h1 class="mhnk-boot-title">VES<span>·PD</span></h1>
      <div class="mhnk-boot-sub">GEO-INTELLIGENCE TERMINAL v0.1</div>
      <div class="mhnk-boot-bar"><div class="mhnk-boot-fill" id="mhnk-boot-fill"></div></div>
      <div class="mhnk-boot-status" id="mhnk-boot-status">INITIALIZING SECURE CHANNEL…</div>
    </div>
  </div>

  <div class="vesperpd-map-page">
    <!-- ═══════════ HUD TOP BAR ═══════════ -->
    <header class="mhnk-hud-top">
      <div class="mhnk-hud-brand">
        <span class="mhnk-hud-logo"><img class="hud-logo-img" src="/logo.gif" alt="VES-PD"></span>
        <div class="mhnk-hud-brand-text">
          <div class="mhnk-hud-title">VES<span>·PD</span></div>
          <div class="mhnk-hud-sub">GEO-INTEL // MAP TERMINAL</div>
        </div>
      </div>
    </header>

    <!-- ═══════════ MAP AREA ═══════════ -->
    <main class="vesperpd-map-main">
      <div id="vesperpd-map-container"></div>

      <!-- Atmosphere overlays -->
      <div class="mhnk-vignette"></div>
      <div class="mhnk-scanlines"></div>

      <!-- Radar sweep -->
      <div class="mhnk-radar" aria-hidden="true">
        <div class="mhnk-radar-ring r0"></div>
        <div class="mhnk-radar-ring r1"></div>
        <div class="mhnk-radar-ring r2"></div>
        <div class="mhnk-radar-sweep"></div>
        <div class="mhnk-radar-blip b1"></div>
        <div class="mhnk-radar-blip b2"></div>
      </div>

      <!-- Style Controls -->
      <div class="vesperpd-map-controls">
        <div class="mhnk-style-panel">
          <div class="mhnk-panel-tag">◢ MAP LAYER</div>
          <div class="mhnk-style-btns">
            <button class="mhnk-style-btn active" data-style="atlas" onclick="VESPD_MAP.switchStyle('atlas')">🗺 ATLAS</button>
            <button class="mhnk-style-btn" data-style="satelite" onclick="VESPD_MAP.switchStyle('satelite')">🛰 SATELITE</button>
          </div>
        </div>
      </div>

      <!-- Crosshair (เป้ากลางจอ) -->
      <div class="mhnk-crosshair">
        <div class="mhnk-crosshair-circle"></div>
        <div class="mhnk-crosshair-h"></div>
        <div class="mhnk-crosshair-v"></div>
      </div>

      <!-- Hint bar -->
      <div class="mhnk-hint">▸ คลิกบนแผนที่เพื่อลงจุดแจ้ง <span class="mhnk-hint-eng">// CLICK MAP TO DROP PIN</span></div>
    </main>

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="vesperpd-map-sidebar">
      <div class="mhnk-sidebar-header">
        <div class="mhnk-sidebar-title-row">
          <div class="mhnk-sidebar-badge"><img class="sidebar-logo-img" src="/logo.gif" alt="VES-PD"></div>
          <div class="mhnk-dc-connect" id="mhnk-dc-connect">
            <a href="/auth/discord?state=map" class="mhnk-dc-btn" id="mhnk-dc-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="flex-shrink:0">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.416-.606.87-1.28 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
              </svg>
              <span>เชื่อมต่อ DC</span>
            </a>
            <div class="mhnk-dc-info" id="mhnk-dc-info" style="display:none;">
              <img id="mhnk-dc-avatar" class="mhnk-dc-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="DC">
              <div class="mhnk-dc-details">
                <div class="mhnk-dc-name" id="mhnk-dc-name">-</div>
                <div class="mhnk-dc-id" id="mhnk-dc-id">ID: -</div>
              </div>
              <button type="button" class="mhnk-dc-disconnect" id="mhnk-dc-disconnect" title="ตัดการเชื่อมต่อ DC">✕</button>
            </div>
          </div>
        </div>
        <div class="mhnk-sidebar-scanline"></div>
      </div>

      <div class="mhnk-sidebar-controls">
        <div class="mhnk-search-box">
          <span class="mhnk-search-icon">⌕</span>
          <input type="text" id="mhnk-poi-search" placeholder="SEARCH เป้า… เจาะระบบฐานข้อมูล" autocomplete="off" />
        </div>
        <div class="mhnk-filter-wrap">
          <div id="mhnk-poi-filter" class="mhnk-cat-select-wrap" aria-label="กรองตามหมวดหมู่"></div>
        </div>
        <button class="mhnk-export-btn" onclick="window.location.href='/Challenge'" title="ทายตำแหน่งจากชื่อสถานที่ 50 จุด">
          <span class="mhnk-export-ico">🎮</span>
          <span class="mhnk-export-lbl">PLAY LOCATE MAP</span>
          <span class="mhnk-export-hint">50 TARGETS</span>
        </button>
      </div>

      <div class="mhnk-poi-stats" id="mhnk-poi-stats">
        <span class="mhnk-stat-num">0</span>
        <span class="mhnk-stat-unit">BEACONS</span>
        <span class="mhnk-stat-sig">●&nbsp;REC&nbsp;✓</span>
      </div>

      <div class="mhnk-poi-list" id="mhnk-poi-list">
        <div class="mhnk-empty">⏳ กำลังโหลด...</div>
      </div>
    </aside>
  </div>
<!-- ═══════════ MODAL ═══════════ -->
  <div class="mhnk-modal-overlay" id="mhnk-modal-overlay">
    <div id="mhnk-modal-body"></div>
  </div>

  <!-- Overlay Controls -->
  <div class="mhnk-overlay-panel" id="overlay-panel">
    <div class="mhnk-overlay-title" onclick="VESPD_OVERLAY.togglePanel()">◢ ZONES</div>
    <div class="mhnk-overlay-content" id="overlay-content">
      <div class="mhnk-overlay-colors">
        <div class="mhnk-overlay-color-btn active" data-color="#ff2d55" style="--oc:#ff2d55" onclick="VESPD_OVERLAY.setColor('#ff2d55')"></div>
        <div class="mhnk-overlay-color-btn" data-color="#2aff9b" style="--oc:#2aff9b" onclick="VESPD_OVERLAY.setColor('#2aff9b')"></div>
        <div class="mhnk-overlay-color-btn" data-color="#dc6d0b" style="--oc:#dc6d0b" onclick="VESPD_OVERLAY.setColor('#dc6d0b')"></div>
      </div>
      <div class="mhnk-overlay-tools">
        <div class="mhnk-overlay-tool" onclick="VESPD_OVERLAY.startDraw('polygon')" title="วาด">✏</div>
        <div class="mhnk-overlay-tool" onclick="VESPD_OVERLAY.startEdit()" title="แก้ไข">✎</div>
        <div class="mhnk-overlay-tool" onclick="VESPD_OVERLAY.startDelete()" title="ลบ">✕</div>
        <div class="mhnk-overlay-tool" onclick="VESPD_OVERLAY.finishDraw()" title="เสร็จสิ้น">✓</div>
      </div>
      <div class="mhnk-overlay-btns">
        <div class="mhnk-overlay-btn" id="overlay-btn-all" onclick="VESPD_OVERLAY.toggleAll()" style="--oc:#dc6d0b">
          <div class="mhnk-overlay-dot"></div>
          <div class="mhnk-overlay-label">เปิด/ปิด ทั้งหมด</div>
        </div>
      </div>
      <div class="mhnk-overlay-clear" onclick="VESPD_OVERLAY.clearDrawn()">CLEAR DRAWN</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <!-- Leaflet.draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Map Module Scripts -->
  <script src="/map-module/src/map-categories.js?v=40"></script>
  <script src="/map-module/src/map-core.js?v=39"></script>
  <script src="/map-module/src/map-poi.js?v=41"></script>
  <script src="/map-module/src/map-dc.js?v=39"></script>

  <!-- Overlay Module -->
  <script src="/map-module/overlay/src/overlay-data.js?v=31"></script>
  <script src="/map-module/overlay/src/overlay-core.js?v=31"></script>

  <script>
    // ══════════ BOOT SCREEN ANIMATION ══════════
    (function bootStart() {
      var steps = [
        'DECRYPTING ENCRYPTED TILES…',
        'LINKING SATELLITE UPLINK…',
        'SYNCING TACTICAL DATABASE…',
        'CALIBRATING HUD INTERFACE…',
        'ACCESS GRANTED · WELCOME OFFICER'
      ];
      var i = 0;
      var fill = document.getElementById('mhnk-boot-fill');
      var status = document.getElementById('mhnk-boot-status');
      if (!fill || !status) return;

      function tick() {
        i++;
        var pct = Math.min(i / 16, 1);
        fill.style.width = (pct * 100) + '%';
        if (i % 3 === 0) status.textContent = steps[Math.min(Math.floor(i / 4), steps.length - 1)];
        if (pct < 1) {
          setTimeout(tick, 70);
        } else {
          setTimeout(function () {
            var boot = document.getElementById('mhnk-boot');
            if (boot) boot.classList.add('done');
          }, 220);
        }
      }
      setTimeout(tick, 150);
    })();

    // ══════════ INIT MAP + POI ══════════
    document.addEventListener('DOMContentLoaded', function () {
      try {
        VESPD_MAP.init('vesperpd-map-container');

        // Init Overlay
        VESPD_OVERLAY.init(VESPD_MAP.map, OVERLAY_ZONES);
      } catch (e) {
        console.error('[VES-PD] Map init error:', e);
      }

      var startPoi = function () {
        try {
          VESPD_POI.init();
        } catch (e) {
          console.error('[VES-PD] POI init error:', e);
          setTimeout(function () {
            try { VESPD_POI.init(); } catch (e2) { console.error('[VES-PD] POI retry error:', e2); }
          }, 1000);
        }
      };

      // Initialize DC Auth
      if (typeof VESPD_DC !== 'undefined') {
        VESPD_DC.init(function(isConnected, dcId, dcName) {
          // Re-load POIs to update authorized IDs and re-render
          if (typeof VESPD_POI !== 'undefined' && VESPD_POI.pois) {
            VESPD_POI.loadPois();
          }
        });
      }

      document.addEventListener('vesperpd-map-ready', startPoi);
      setTimeout(startPoi, 500);
    });
  </script>
</body>
</html>
