# ========================================
# Render Blueprint Configuration
# VES-PD MAP (standalone)
# ========================================

services:
  - type: web
    name: vesperpd-map
    env: node
    region: singapore
    branch: main
    # ไม่มี build step — front-end เป็น vanilla JS โหลดผ่าน <script src> ตรงๆ
    # (เว็บหลักเขียน "npm install && npm run build" ไว้ แต่ไม่มี script build → build พัง)
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: PORT
        value: 3001
      # รหัส 4 หลักสำหรับปลดล็อกการแก้ไขแผนที่
      - key: ADMIN_PIN
        sync: false
      - key: SHEET_ID
        sync: false
      # วาง JSON ดิบๆ ไม่ต้องใส่ quote (Render ไม่ได้ parse แบบ dotenv)
      - key: GOOGLE_JSON_KEY
        sync: false
